name: dsh-validate

on:
  push:
    paths:
      - 'skills/**'
      - 'dsh/**'
  pull_request:
    paths:
      - 'skills/**'
      - 'dsh/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node dsh/scripts/validate.mjs
